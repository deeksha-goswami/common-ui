[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-python"
version = "1.0.0"
description = "A minimal Hello World Python project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hello-world = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
