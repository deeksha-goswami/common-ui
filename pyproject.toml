[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-python"
version = "1.0.0"
description = "A minimal Hello World Python project."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hello-world = "hello_world.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
